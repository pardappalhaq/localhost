<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <title>Daftar Mahasiswa</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        /* Card Styling for sleek look */
        .custom-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            padding: 30px;
            margin-bottom: 30px;
            border: none;
        }

        h1 {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Table Styling */
        .table {
            vertical-align: middle;
        }
        .table thead th {
            background-color: #4a69bd;
            color: white;
            font-weight: 500;
            border: none;
            padding: 15px;
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(74, 105, 189, 0.05);
        }
        .table-hover tbody tr:hover {
            background-color: rgba(74, 105, 189, 0.1);
            transition: all 0.2s ease;
        }

        /* Form & Input Styling */
        .form-label {
            font-weight: 500;
            color: #555;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #e1e5eb;
            padding: 10px 15px;
            transition: all 0.3s;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(74, 105, 189, 0.2);
            border-color: #4a69bd;
        }
        .form-control[readonly] {
            background-color: #f8f9fa;
        }

        /* Image Styling */
        .img-thumbnail {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 4px solid #4a69bd;
            box-shadow: 0 4px 15px rgba(74, 105, 189, 0.2);
            margin: 0 auto;
            display: block;
        }

        /* Button Styling */
        .btn-primary {
            background-color: #4a69bd;
            border: none;
            border-radius: 8px;
            padding: 10px 25px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #3c55a5;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(74, 105, 189, 0.3);
        }
        .btn-primary:disabled {
            background-color: #a4b0be;
            cursor: not-allowed;
        }
    </style>
  </head>
  <body>
    <div class="container">
        <h1>Dashboard Mahasiswa</h1>
        
        <div class="custom-card">
            <div class="table-responsive">
                <table class="table table-striped table-hover text-center" id="tabelMhs">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>NIM</th>
                            <th>Nama</th>
                            <th>Program Studi</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </div>
        
        <div class="custom-card">
            <div class="row align-items-center">
                <div class="col-md-3 mb-4 mb-md-0">
                    <img class="img-thumbnail" src="images/blank.png" id="foto" alt="Foto Mahasiswa">
                </div>
                <div class="col-md-9">
                    <form>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">NIM</label>
                                <input type="text" class="form-control" id="nim" readonly>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Program Studi</label>
                                <input type="text" class="form-control" id="prodi" readonly>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" class="form-control" id="nama" readonly>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-primary" id="prev" disabled>&#8592; Sebelumnya</button>
                            <button type="button" class="btn btn-primary" id="next">Selanjutnya &#8594;</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="xml.js"></script>
  </body>
</html>
