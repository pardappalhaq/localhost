<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa JSON</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="json.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .form-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            margin-bottom: 50px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .form-box {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: 500;
            color: #4a5568;
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: #2d3748;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .file-input-container {
            position: relative;
            width: 100%;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn-file {
            background: #f7fafc;
            color: #718096;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px dashed #cbd5e0;
            text-align: center;
            transition: all 0.3s ease;
            display: block;
            cursor: pointer;
            font-weight: 500;
        }

        .file-input-wrapper:hover .btn-file {
            background: #edf2f7;
            border-color: #a0aec0;
            color: #4a5568;
        }

        .preview-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        #preview {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            object-fit: cover;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid white;
        }
        
        #fileName {
            font-size: 0.9rem;
            color: #718096;
            display: none;
            word-break: break-all;
        }

        #tambahData {
            margin-top: 10px;
            padding: 16px 20px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.05rem;
            transition: transform 0.2s, box-shadow 0.2s;
            grid-column: 1 / -1;
            justify-self: center;
            width: 100%;
            max-width: 400px;
            letter-spacing: 0.5px;
        }

        #tambahData:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
        }

        #tambahData:active {
            transform: translateY(0);
        }

        #mahasiswa {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            border-color: rgba(255, 255, 255, 1);
        }

        .card img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 5px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        .card h3 {
            margin-bottom: 10px;
            font-weight: 600;
            color: #2d3748;
            font-size: 1.25rem;
        }

        .card p {
            color: #4a5568;
            font-size: 0.95rem;
            background: #edf2f7;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #fc8181;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            opacity: 0;
            transform: scale(0.8);
        }

        .card:hover .delete-btn {
            opacity: 1;
            transform: scale(1);
        }

        .delete-btn:hover {
            background: #e53e3e;
            transform: scale(1.1) !important;
        }
        
        /* Stagger animations for cards */
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }

    </style>
</head>
<body>

<div class="container">

    <h1 class="header-title">Data Mahasiswa</h1>

    <div class="form-box">

        <div class="form-group">
            <label for="nim">Nomor Induk Mahasiswa (NIM)</label>
            <input type="text" id="nim" placeholder="Masukkan NIM..." autocomplete="off">
        </div>

        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan Nama Lengkap..." autocomplete="off">
        </div>

        <div class="form-group full-width file-input-container">
            <label>Foto Mahasiswa</label>
            <div class="file-input-wrapper">
                <span class="btn-file"><i class="fas fa-cloud-upload-alt" style="margin-right: 8px;"></i>Pilih Foto atau Tarik ke Sini</span>
                <input type="file" id="foto" accept="image/*">
            </div>
            <div class="preview-container">
                <img id="preview" alt="Preview Foto">
                <span id="fileName"></span>
            </div>
        </div>

        <button id="tambahData">
            <i class="fas fa-user-plus" style="margin-right: 8px;"></i> Tambah Mahasiswa
        </button>

    </div>

    <div id="mahasiswa"></div>

</div>

</body>
</html>
