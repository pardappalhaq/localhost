<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>jQuery Dropdown Effects – Demo 2 (Stack)</title>
    <meta name="description" content="Demo efek dropdown jQuery dengan animasi stack dan sudut random pada setiap item menu."/>
    <link rel="stylesheet" type="text/css" href="css/style2.css"/>
    <script src="js/modernizr.custom.63321.js"></script>
</head>
<body>
    <div class="container">
        <header class="clearfix">
            <h1>jQuery Dropdown Effects
                <span>Simple Animation Demos</span>
            </h1>
            <nav class="codrops-demos">
                <a href="index.html">Demo 1</a>
                <a class="current-demo" href="index2.html">Demo 2</a>
                <a href="index3.html">Demo 3</a>
            </nav>
        </header>

        <section class="main clearfix">
            <div class="fleft">
                <span class="section-label">Demo 2 — Stack + Random</span>
                <p>Efek pada menu item ini menggunakan konsep <em>stack</em> dengan slight offset. Setiap item menu diberikan sudut random yang berbeda-beda untuk tampilan yang lebih dinamis dan unik.</p>
            </div>
            <div class="fleft">
                <select id="cd-dropdown" class="cd-select">
                    <option value="-1" selected>Contact-Us via:</option>
                    <option value="1"  class="icon-google-plus">Google Plus</option>
                    <option value="2"  class="icon-facebook">Facebook</option>
                    <option value="3"  class="icon-twitter">Twitter</option>
                    <option value="4"  class="icon-github">GitHub</option>
                </select>
            </div>
        </section>
    </div>

    <script type="text/javascript" src="js/jquery-1.8.3.min.js"></script>
    <script type="text/javascript" src="js/jquery.dropdown.js"></script>
    <script type="text/javascript">
        $(function () {
            $('#cd-dropdown').dropdown({
                gutter : 5,
                delay  : 100,
                random : true
            });
        });
    </script>
</body>
</html>
