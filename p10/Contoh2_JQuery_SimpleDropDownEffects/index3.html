<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>jQuery Dropdown Effects – Demo 3 (Slide In)</title>
    <meta name="description" content="Demo efek dropdown jQuery dengan animasi sliding per item dengan delay berbeda antar menu."/>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <script src="js/modernizr.custom.63321.js"></script>
</head>
<body>
    <div class="container">
        <header class="clearfix">
            <h1>jQuery Dropdown Effects
                <span>Simple Animation Demos</span>
            </h1>
            <nav class="codrops-demos">
                <a href="index.html">Demo 1</a>
                <a href="index2.html">Demo 2</a>
                <a class="current-demo" href="index3.html">Demo 3</a>
            </nav>
        </header>

        <section class="main clearfix">
            <div class="fleft">
                <span class="section-label">Demo 3 — Slide In</span>
                <p>Contoh ketiga menampilkan efek <em>sliding</em> pada setiap sub menu dan diberikan delay antar slide item menu yang satu dengan lainnya, menciptakan animasi yang halus dan berurutan.</p>
            </div>
            <div class="fleft">
                <select id="cd-dropdown" class="cd-select">
                    <option value="-1" selected>Hadiah Pilihanmu:</option>
                    <option value="1"  class="icon-camera">Camera</option>
                    <option value="2"  class="icon-diamond">Diamonds</option>
                    <option value="3"  class="icon-rocket">Spaceship</option>
                    <option value="4"  class="icon-star">Star</option>
                    <option value="5"  class="icon-clock">Time</option>
                </select>
            </div>
        </section>
    </div>

    <script type="text/javascript" src="js/jquery-1.8.3.min.js"></script>
    <script type="text/javascript" src="js/jquery.dropdown.js"></script>
    <script type="text/javascript">
        $(function () {
            $('#cd-dropdown').dropdown({
                gutter    : 5,
                stack     : false,
                delay     : 100,
                slidingIn : 100
            });
        });
    </script>
</body>
</html>
